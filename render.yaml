# One-click hosting on Render (https://render.com/deploy?repo=https://github.com/Maranibro1/CourseShare).
# Render's free plan wipes the disk on each restart, so give it a Postgres
# database: paste a connection string (for example from a free Neon project)
# as DATABASE_URL when Render asks.
services:
  - type: web
    name: kazikwanza
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_TIME_ZONE
        value: Africa/Nairobi
